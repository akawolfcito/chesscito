name: Cron — public stats snapshot refresh

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: public-stats-snapshot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Refresh the durable all/all snapshot
        env:
          STATS_REFRESH_URL: ${{ secrets.STATS_REFRESH_URL }}
          STATS_REFRESH_SECRET: ${{ secrets.STATS_REFRESH_SECRET }}
        run: |
          if [[ -z "$STATS_REFRESH_URL" || -z "$STATS_REFRESH_SECRET" ]]; then
            echo "::error::Missing STATS_REFRESH_URL or STATS_REFRESH_SECRET"
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="000"
          if http_status="$(curl --silent --max-time 120 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${STATS_REFRESH_SECRET}" \
            "${STATS_REFRESH_URL%/}/api/internal/stats/refresh")"; then
            curl_exit=0
          else
            curl_exit=$?
          fi

          if [[ ! "$http_status" =~ ^2[0-9]{2}$ ]]; then
            echo "::error::Stats refresh returned HTTP ${http_status} (curl exit ${curl_exit})"
            safe_body="$(head -c 4096 "$response_file" | python3 -c 'import os, re, sys
body = sys.stdin.read()
secret = os.environ.get("STATS_REFRESH_SECRET", "")
if secret:
    body = body.replace(secret, "[REDACTED]")
body = re.sub(r"(?i)Bearer\s+[^\s\"\\]+", "Bearer [REDACTED]", body)
body = re.sub(r"(?i)(postgres(?:ql)?|redis|https?)://[^\s\"\\]+", "[REDACTED_URL]", body)
if re.search(r"(?i)authorization|secret|token|password", body):
    body = "[response omitted: sensitive marker detected]"
body = body.replace("::", ": :").replace("\r", "\\r")
sys.stdout.write(body[:4096])')"
            if [[ -n "$safe_body" ]]; then
              printf 'Response body (max 4 KB):\n%s\n' "$safe_body"
            fi
            exit 1
          fi

          if [[ "$curl_exit" -ne 0 ]]; then
            echo "::error::Stats refresh request failed (curl exit ${curl_exit})"
            exit 1
          fi
          echo "Stats refresh succeeded (HTTP ${http_status})."
